name: android-verify
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 36]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (Robolectric frame renders)
        continue-on-error: true
        run: ./gradlew --no-daemon :app:testDebugUnitTest || ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build debug + androidTest APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests on emulator (real video export)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            mkdir -p artifacts
            adb root || true
            sleep 3
            adb wait-for-device
            ./gradlew --no-daemon :app:installDebug
            # Fixtures must live in the app's INTERNAL files dir, owned by the app uid:
            # root-pushed files under /sdcard/Android/data are invisible to the app through FUSE.
            adb shell mkdir -p /data/user/0/com.mukhda.video/files/testphotos
            for i in 0 1 2 3; do adb push test-fixtures/p$i.jpg /data/user/0/com.mukhda.video/files/testphotos/p$i.jpg; done
            adb shell chown -R $(adb shell stat -c %u /data/user/0/com.mukhda.video | tr -d '\r') /data/user/0/com.mukhda.video/files/testphotos
            adb logcat -c || true
            adb shell am start -n com.mukhda.video/com.mukhda.editor.MainActivity || true
            sleep 15
            adb exec-out screencap -p > artifacts/gallery.png || true
            adb shell dumpsys activity activities | grep -i 'topResumedActivity' > artifacts/top-gallery.txt || true
            adb shell am start -n com.mukhda.video/com.mukhda.editor.TemplateDetailActivity --es spec birthday || true
            sleep 12
            adb exec-out screencap -p > artifacts/detail.png || true
            adb shell dumpsys activity activities | grep -i 'topResumedActivity' > artifacts/top-detail.txt || true
            adb shell am start -n com.mukhda.video/com.mukhda.editor.TemplateMakeActivity --es spec birthday --esal photos 'file:///data/user/0/com.mukhda.video/files/testphotos/p0.jpg,file:///data/user/0/com.mukhda.video/files/testphotos/p1.jpg,file:///data/user/0/com.mukhda.video/files/testphotos/p2.jpg,file:///data/user/0/com.mukhda.video/files/testphotos/p3.jpg' || true
            sleep 12
            adb exec-out screencap -p > artifacts/make.png || true
            adb shell dumpsys activity activities | grep -i 'topResumedActivity' > artifacts/top-make.txt || true
            timeout 15m ./gradlew --no-daemon :app:installDebugAndroidTest || true
            timeout 110m adb shell am instrument -w -r com.mukhda.video.test/androidx.test.runner.AndroidJUnitRunner > artifacts/instrument.txt 2>&1 || true
            tail -40 artifacts/instrument.txt || true
            adb logcat -d > artifacts/logcat.txt || true
            adb shell ls -la /data/user/0/com.mukhda.video/files/ci_export/ || true
            adb pull /data/user/0/com.mukhda.video/files/ci_export artifacts/ci_export || true
            adb pull /data/user/0/com.mukhda.video/files/qa artifacts/qa || true
            adb pull /data/user/0/com.mukhda.video/files/exports artifacts/exports || true
            ls -la artifacts || true
            ls -la artifacts/qa artifacts/exports || true
            # Release smoke: install the ACTUAL published APK (same bits she gets) and launch it
            mkdir -p artifacts/release-smoke
            adb uninstall com.mukhda.video || true
            curl -sL -o /tmp/mukhda-release.apk https://github.com/mukhda-apps/mukhda-app/releases/download/v1.3.4/mukhda-1.3.4.apk
            ls -la /tmp/mukhda-release.apk
            adb install /tmp/mukhda-release.apk || true
            adb logcat -c || true
            adb shell am start -n com.mukhda.video/com.mukhda.editor.MainActivity || true
            sleep 15
            adb exec-out screencap -p > artifacts/release-smoke/release_main.png || true
            adb shell am start -n com.mukhda.video/com.mukhda.editor.TemplateDetailActivity --es spec birthday || true
            sleep 10
            adb exec-out screencap -p > artifacts/release-smoke/release_detail.png || true
            adb logcat -d > artifacts/release-smoke/release_logcat.txt || true
            (grep -i 'FATAL EXCEPTION' artifacts/release-smoke/release_logcat.txt && echo 'RELEASE_SMOKE_FATAL_FOUND') || echo 'RELEASE_SMOKE_CLEAN'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-output-api${{ matrix.api-level }}
          path: |
            artifacts/**
            app/build/outputs/renderedFrames/**
            app/build/reports/androidTests/**
          retention-days: 30
