name: android-verify
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (Robolectric frame renders)
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build debug + androidTest APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Instrumented tests on emulator (real video export)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            ./gradlew --no-daemon :app:connectedDebugAndroidTest --continue
            mkdir -p artifacts
            adb shell am start -n com.mukhda.video/com.mukhda.editor.MainActivity || true
            sleep 8
            adb exec-out screencap -p > artifacts/gallery.png || true
            adb pull /sdcard/Android/data/com.mukhda.video/files/ artifacts/files || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-output
          path: |
            artifacts/**
            app/build/outputs/renderedFrames/**
            app/build/reports/androidTests/**
          retention-days: 30
