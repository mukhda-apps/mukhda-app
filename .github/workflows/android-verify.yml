name: android-verify
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (Robolectric frame renders)
        run: ./gradlew --no-daemon :app:testDebugUnitTest || ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build debug + androidTest APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests on emulator (real video export)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            mkdir -p artifacts
            ./gradlew --no-daemon :app:installDebug
            adb shell mkdir -p /sdcard/Android/data/com.mukhda.video/files/testphotos
            for i in 0 1 2 3; do adb push test-fixtures/p$i.jpg /sdcard/Android/data/com.mukhda.video/files/testphotos/p$i.jpg; done
            adb logcat -c || true
            adb shell am start -n com.mukhda.video/com.mukhda.editor.MainActivity || true
            sleep 15
            adb exec-out screencap -p > artifacts/gallery.png || true
            adb shell dumpsys activity activities | grep -i 'topResumedActivity' > artifacts/top-gallery.txt || true
            adb shell am start -n com.mukhda.video/com.mukhda.editor.TemplateDetailActivity --es spec birthday || true
            sleep 12
            adb exec-out screencap -p > artifacts/detail.png || true
            adb shell dumpsys activity activities | grep -i 'topResumedActivity' > artifacts/top-detail.txt || true
            adb shell am start -n com.mukhda.video/com.mukhda.editor.TemplateMakeActivity --es spec birthday --esal photos 'file:///sdcard/Android/data/com.mukhda.video/files/testphotos/p0.jpg,file:///sdcard/Android/data/com.mukhda.video/files/testphotos/p1.jpg,file:///sdcard/Android/data/com.mukhda.video/files/testphotos/p2.jpg,file:///sdcard/Android/data/com.mukhda.video/files/testphotos/p3.jpg' || true
            sleep 12
            adb exec-out screencap -p > artifacts/make.png || true
            adb shell dumpsys activity activities | grep -i 'topResumedActivity' > artifacts/top-make.txt || true
            timeout 25m ./gradlew --no-daemon :app:connectedDebugAndroidTest --continue || true
            adb logcat -d > artifacts/logcat.txt || true
            adb exec-out run-as com.mukhda.video cat /sdcard/Android/data/com.mukhda.video/files/test_export_birthday.mp4 > artifacts/test_export_birthday.mp4 || true
            for f in 0 1 2; do adb exec-out run-as com.mukhda.video cat /sdcard/Android/data/com.mukhda.video/files/frames/export_f$f.png > artifacts/export_f$f.png || true; done
            ls -la artifacts || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-output
          path: |
            artifacts/**
            app/build/outputs/renderedFrames/**
            app/build/reports/androidTests/**
          retention-days: 30
