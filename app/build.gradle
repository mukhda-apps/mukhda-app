plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.mukhda.editor'
    compileSdk 34
    defaultConfig {
        applicationId 'com.mukhda.video'
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName '1.1.3'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    signingConfigs {
        release {
            storeFile file('/home/sandbox/mukhda-release.jks')
            storePassword 'mukhda2026key'
            keyAlias 'mukhda'
            keyPassword 'mukhda2026key'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }
    packaging { resources { excludes += ['META-INF/DEPENDENCIES'] } }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    def m3 = '1.4.1'
    implementation "androidx.media3:media3-exoplayer:$m3"
    implementation "androidx.media3:media3-ui:$m3"
    implementation "androidx.media3:media3-transformer:$m3"
    implementation "androidx.media3:media3-effect:$m3"
    implementation "androidx.media3:media3-common:$m3"
    implementation 'com.alphacephei:vosk-android:0.3.75'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
